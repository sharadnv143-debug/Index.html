<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultra-Fast MF Form Scanner (Groq)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
    <div class="mb-4 text-center">
      <h1 class="text-xl font-bold tracking-tight text-white">MF Form Validator</h1>
      <p class="text-xs text-orange-400 mt-1">Powered by Groq High-Speed Vision + Beep Alert</p>
    </div>

    <!-- Groq API Key Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Groq API Key (Free)</label>
      <input 
        id="apiKeyInput" 
        type="password" 
        placeholder="gsk_..." 
        class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-orange-500 font-mono"
      />
    </div>

    <!-- Camera Box -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-slate-700 shadow-inner flex items-center justify-center">
      <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="snapshotCanvas" class="hidden"></canvas>

      <div class="absolute inset-4 border-2 border-dashed border-white/40 rounded-lg pointer-events-none flex items-center justify-center">
        <span class="text-white/40 text-xs font-medium tracking-wide">Align Form Inside Border</span>
      </div>

      <!-- Scanning Spinner -->
      <div id="scanIndicator" class="hidden absolute inset-0 bg-orange-950/75 backdrop-blur-xs flex flex-col items-center justify-center text-center p-4">
        <div class="w-8 h-8 border-4 border-orange-400 border-t-transparent rounded-full animate-spin mb-2"></div>
        <p class="text-sm font-semibold text-orange-200">Analyzing Form Details...</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="mt-4 flex gap-2">
      <button 
        id="startCameraBtn" 
        class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-[0.98] py-2.5 rounded-lg font-medium text-xs transition"
      >
        Start Camera
      </button>
      <button 
        id="captureBtn" 
        disabled 
        class="flex-1 bg-orange-600 hover:bg-orange-500 disabled:bg-slate-700 disabled:opacity-50 active:scale-[0.98] py-2.5 rounded-lg font-semibold text-xs tracking-wide text-white transition shadow-lg shadow-orange-600/20"
      >
        Scan & Verify
      </button>
    </div>

    <!-- Result / Status Card -->
    <div id="statusCard" class="mt-5 p-4 rounded-xl border border-slate-700/60 bg-slate-950/50 hidden">
      <div class="flex items-center gap-2 mb-2">
        <span id="statusIcon" class="text-lg"></span>
        <h3 id="statusTitle" class="text-sm font-bold"></h3>
      </div>
      <p id="statusMsg" class="text-xs text-slate-300 leading-relaxed"></p>
      <div id="fieldBreakdown" class="mt-3 space-y-1.5 border-t border-slate-800 pt-3"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('snapshotCanvas');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const scanIndicator = document.getElementById('scanIndicator');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusIcon = document.getElementById('statusIcon');
    const statusMsg = document.getElementById('statusMsg');
    const fieldBreakdown = document.getElementById('fieldBreakdown');

    // Auto-load saved Groq key
    if (localStorage.getItem("saved_groq_api_key")) {
      apiKeyInput.value = localStorage.getItem("saved_groq_api_key");
    }

    // Two Short Loud Beeps (Missing Alert)
    function playMissingFieldAlert() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + start);
          osc.stop(audioCtx.currentTime + start + duration);
        };

        playTone(950, 0, 0.14);
        playTone(950, 0.22, 0.18);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // Camera Access
    startCameraBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        });
        video.srcObject = stream;
        captureBtn.disabled = false;
        startCameraBtn.classList.add('hidden');
      } catch (err) {
        alert("Camera permission error: " + err.message);
      }
    });

    // Capture & Trigger Groq
    captureBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please paste your Groq API Key (starts with gsk_).");
        apiKeyInput.focus();
        return;
      }
      localStorage.setItem("saved_groq_api_key", apiKey);

      // Snapshot from video
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Url = canvas.toDataURL('image/jpeg', 0.85);

      scanIndicator.classList.remove('hidden');
      captureBtn.disabled = true;

      try {
        const result = await verifyWithGroq(apiKey, base64Url);
        renderScanResults(result);
      } catch (err) {
        console.error(err);
        showErrorUI(err.message);
      } finally {
        scanIndicator.classList.add('hidden');
        captureBtn.disabled = false;
      }
    });

    // Groq Llama-3.2 Vision API Call
    async function verifyWithGroq(apiKey, base64Url) {
      const prompt = `You are an auditor verifying a physical Mutual Fund application or SIP mandate form.
Inspect the visible page captured in the image.
Determine if mandatory fields on this visible page are filled or missing/blank:
- Applicant Details: Applicant Name, PAN, DOB, Mobile, Email
- Bank Details: Bank Name, Account Number, IFSC
- Investment/SIP: Amount, Frequency, Scheme
- Signatures: Investor Signature / Mandate Signature

Rules:
1. ONLY evaluate sections visible on this captured page.
2. Label each visible field as "filled" or "missing".
3. Return ONLY valid raw JSON without markdown backticks:
{
  "allMandatoryFilled": false,
  "detectedPage": "Applicant / Bank / SIP / Signature",
  "fieldStatus": {
    "ApplicantName": "filled",
    "Signature": "missing"
  },
  "notes": "Short description of missing items"
}`;

      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.2-90b-vision-preview",
          messages: [
            {
              role: "user",
              content: [
                { type: "text", text: prompt },
                { type: "image_url", image_url: { url: base64Url } }
              ]
            }
          ],
          response_format: { type: "json_object" }
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || "Groq API Request failed");
      }

      const resData = await response.json();
      return JSON.parse(resData.choices[0].message.content);
    }

    // Render & Alert UI
    function renderScanResults(data) {
      statusCard.classList.remove('hidden');
      fieldBreakdown.innerHTML = "";

      if (!data.allMandatoryFilled) {
        playMissingFieldAlert(); // Trigger Beep Sound
        statusCard.className = "mt-5 p-4 rounded-xl border border-red-500/60 bg-red-950/20";
        statusIcon.textContent = "⚠️";
        statusTitle.textContent = "Mandatory Fields Missing!";
        statusTitle.className = "text-sm font-bold text-red-400";
        statusMsg.textContent = `${data.detectedPage ? '[' + data.detectedPage + '] ' : ''}${data.notes || "Please check unfilled fields."}`;
      } else {
        statusCard.className = "mt-5 p-4 rounded-xl border border-emerald-500/60 bg-emerald-950/20";
        statusIcon.textContent = "✅";
        statusTitle.textContent = "Page Verified Complete";
        statusTitle.className = "text-sm font-bold text-emerald-400";
        statusMsg.textContent = "All visible mandatory sections on this page are filled.";
      }

      if (data.fieldStatus) {
        Object.entries(data.fieldStatus).forEach(([field, status]) => {
          const isFilled = status === "filled";
          const row = document.createElement("div");
          row.className = "flex items-center justify-between text-xs py-1.5 px-2 rounded bg-slate-900/60";
          row.innerHTML = `
            <span class="font-medium ${isFilled ? 'text-slate-300' : 'text-red-300 font-semibold'}">${field}</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
              isFilled ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800 animate-pulse'
            }">${status}</span>
          `;
          fieldBreakdown.appendChild(row);
        });
      }
    }

    function showErrorUI(msg) {
      statusCard.classList.remove('hidden');
      statusCard.className = "mt-5 p-4 rounded-xl border border-amber-500/60 bg-amber-950/20";
      statusIcon.textContent = "❗";
      statusTitle.textContent = "Scan Error";
      statusTitle.className = "text-sm font-bold text-amber-400";
      statusMsg.textContent = msg;
    }
  </script>
</body>
</html>
